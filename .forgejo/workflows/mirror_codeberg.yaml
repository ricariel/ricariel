---
name: Mirror

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
      - master
  # The changelog commit arrives with the automatic token and starts no push
  # run in Forgejo. The daily run picks it up; the time of day is staggered
  # per target so that not all mirrors run at once.
  schedule:
    - cron: '10 2 * * *'
  workflow_dispatch:

# Runs of the same target one after another: Forgejo queues them per
# repository in this group instead of cancelling them. Parallel pushes to the
# same target failed with "incorrect old value provided" otherwise.
concurrency:
  group: mirror-codeberg
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror
        uses: https://git.zyria.de/pyrox/actions/mirror@v1
        with:
          target_repo_url: 'git@codeberg.org:ricariel/${{ github.event.repository.name }}.git'
          ssh_private_key: ${{ secrets.ZYRIA_CODEBERG_SSH }}
