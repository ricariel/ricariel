---
name: Mirror

on:
  push:
    branches:
      - main
      - master

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror
        uses: https://git.zyria.de/pyrox/actions/mirror@v1
        with:
          target_repo_url: git@github.com:ricariel/ricariel.git
          ssh_private_key: ${{ secrets.ZYRIA_GITHUB_SSH }}
