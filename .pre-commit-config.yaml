---
# Von Hand gepflegt, aber nach einem gemeinsamen Muster: eine Basis, die in
# allen Repositories identisch ist, plus Profile für das, was hier tatsächlich
# liegt. Hooks für Dateitypen, die es in diesem Repo nicht gibt, fehlen
# bewusst — sie kosteten in der CI Installationszeit, ohne je etwas zu prüfen.
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: '3.11.1'
    hooks:
      - id: editorconfig-checker
        alias: ec
        exclude: ^LICENSE
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-crlf
      - id: remove-crlf
      - id: forbid-tabs
      - id: remove-tabs
        args: [--whitespaces-count, '2']
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: check-mailmap
      - id: forbid-binary
        exclude: |
          (?x)^(
            (static|assets)/images/.*\.(jpg|png|ico)|
            (static|assets)/.*\.(jpg|png|ico)
          )$
      - id: git-check  # richtet sich nach .gitattributes
      - id: script-must-have-extension
  - repo: https://github.com/jorisroovers/gitlint
    rev: 'v0.19.1'
    hooks:
      - id: gitlint
  - repo: local
    hooks:
      - id: forbid-unicode-non-breaking-spaces
        name: Detect unicode non-breaking space character U+00A0 aka M-BM-
        language: system
        entry: perl -ne 'print if $m = /\xc2\xa0/; $t ||= $m; END{{exit $t}}'
        files: ''
        types: [text]
      - id: remove-unicode-non-breaking-spaces
        name: Remove unicode non-breaking space character U+00A0 aka M-BM-
        language: system
        entry: perl -pi* -e 's/\xc2\xa0/ /g && ($t = 1) && print STDERR $_; END{{exit
          $t}}'
        files: ''
        types: [text]
      - id: forbid-en-dashes
        name: Detect the EXTREMELY confusing unicode character U+2013
        language: system
        entry: perl -ne 'print if $m = /\xe2\x80\x93/; $t ||= $m; END{{exit $t}}'
        files: ''
        types: [text]
