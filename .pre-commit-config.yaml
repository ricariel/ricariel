---
# Von Hand gepflegt, aber nach einem gemeinsamen Muster: eine Basis, die in
# allen Repositories identisch ist, plus Profile für das, was hier tatsächlich
# liegt. Hooks für Dateitypen, die es in diesem Repo nicht gibt, fehlen
# bewusst — sie kosteten in der CI Installationszeit, ohne je etwas zu prüfen.
default_language_version:
  python: python3

# CHANGELOG.md wird von git-cliff erzeugt. Was ein Hook daran zurechtruecken
# wuerde, ueberschreibt der naechste Lauf ohnehin wieder.
exclude: |
  (?x)^(
    CHANGELOG\.md$
  )

# generate-commit-msg haengt an der Stage prepare-commit-msg, nicht an
# pre-commit. Ohne diese Zeile muesste der Typ bei jedem `pre-commit install`
# von Hand mitgegeben werden. In der CI aendert sie nichts: `pre-commit run`
# ohne --hook-stage laeuft nur ueber die Stage pre-commit.
default_install_hook_types: [pre-commit, prepare-commit-msg]

# Ein Hook ohne eigene stages laeuft in JEDER installierten Stage — mit
# pre-commit, prepare-commit-msg und commit-msg also dreimal pro Commit.
# Diese Zeile begrenzt die Vorgabe auf pre-commit. Hooks, die ihre Stage
# selbst angeben (gitlint, generate-commit-msg), behalten sie.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: '3.11.1'
    hooks:
      - id: editorconfig-checker
        alias: ec
        exclude: ^LICENSE
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-crlf
      - id: remove-crlf
      - id: forbid-tabs
      - id: remove-tabs
        args: [--whitespaces-count, '2']
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: check-mailmap
      - id: forbid-binary
        exclude: |
          (?x)^(
            (static|assets)/images/.*\.(jpg|png|ico)|
            (static|assets)/.*\.(jpg|png|ico)
          )$
      - id: git-check  # richtet sich nach .gitattributes
      - id: script-must-have-extension
  - repo: https://github.com/jorisroovers/gitlint
    rev: 'v0.19.1'
    hooks:
      - id: gitlint
  # Loesen die frueheren Perl-Einzeiler ab. fix-nbsp meldet und ersetzt in
  # einem Durchgang; fuer U+2013 gibt es bewusst keinen Fixer, denn die
  # richtige Wahl haengt vom Satz ab.
  - repo: https://git.zyria.de/pyrox/pre-commit-hooks
    rev: v1.1.2
    hooks:
      - id: fix-nbsp
      - id: forbid-en-dash
      - id: generate-commit-msg
